[package]
name = "vibe-timer"
version = "0.1.0"
description = "Минималистичный таймер для автоматического управления питанием системы"
authors = ["vibecode"]
license = "MIT"
repository = "https://github.com/colosss/vibe_timer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt", "time"] }
rodio = "0.17"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
