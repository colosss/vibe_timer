name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например, v0.1.0). Тег должен уже существовать."
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux x86_64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libasound2-dev \
            libssl-dev \
            libxdo-dev \
            libfuse2 \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - name: Build packages
        run: npm run tauri build -- --bundles deb,appimage,rpm

      - uses: actions/upload-artifact@v4
        with:
          name: packages-linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/rpm/*.rpm

  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: npm ci

      - name: Build packages
        run: npm run tauri build -- --bundles msi,nsis

      - uses: actions/upload-artifact@v4
        with:
          name: packages-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

  release:
    name: Publish release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect assets
        run: |
          mkdir -p dist
          find artifacts/packages-linux -name '*.AppImage' -exec cp {} dist/vibe-timer-x86_64.AppImage \;
          find artifacts/packages-linux -name '*.deb' -exec cp {} dist/vibe-timer_amd64.deb \;
          find artifacts/packages-linux -name '*.rpm' -exec cp {} dist/vibe-timer-x86_64.rpm \;
          find artifacts/packages-windows -name '*.exe' -exec cp {} dist/vibe-timer_x64-setup.exe \;
          find artifacts/packages-windows -name '*.msi' -exec cp {} dist/vibe-timer_x64.msi \;
          cp scripts/install.sh dist/install.sh
          cp scripts/INSTALL.md dist/INSTALL.md
          cp src-tauri/icons/128x128.png dist/vibe-timer.png
          chmod +x dist/install.sh
          cd dist
          ls -lh
          sha256sum \
            vibe-timer-x86_64.AppImage \
            vibe-timer_amd64.deb \
            vibe-timer-x86_64.rpm \
            vibe-timer_x64-setup.exe \
            vibe-timer_x64.msi \
            install.sh INSTALL.md vibe-timer.png > SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: Vibe Timer ${{ inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
